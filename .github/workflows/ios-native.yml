name: Chelsy iOS 17 compile
on:
  workflow_dispatch:
  push:
    branches: ['codex/chelsy-094-ios', 'main']
    paths: ['Android_Client/**', '.github/workflows/ios-native.yml']
permissions:
  contents: read
jobs:
  ios:
    name: iOS target compile (unsigned simulator)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
      - working-directory: Android_Client
        run: |
          flutter pub get
          flutter build ios --simulator --debug --no-codesign
      - uses: actions/upload-artifact@v4
        with:
          name: Chelsy-0.9.4-iOS-simulator
          path: Android_Client/build/ios/iphonesimulator/Runner.app
          retention-days: 7
