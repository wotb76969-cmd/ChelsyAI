name: chelsy_ai_client
description: Chelsy AI 0.9.4 - mobile client for your private Chelsy Host
publish_to: none
version: 0.9.4+95
environment:
  sdk: '>=3.9.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  shared_preferences: ^2.5.6
  material_ui: ^1.11.0
  flutter_secure_storage: ^11.2.0
  flutter_markdown_plus: ^1.0.12
  url_launcher: ^6.3.3
  path_provider: ^2.1.6
  share_plus: ^13.3.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - chelsy_logo.png
  # JetBrains Mono (Apache-2.0, see fonts/JetBrainsMono-LICENSE.txt): code blocks render
  # monospace with Cyrillic on every device and renderer.
  fonts:
    - family: ChelsyMono
      fonts:
        - asset: fonts/JetBrainsMono-Regular.ttf
